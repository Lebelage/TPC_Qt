[binaries]
cpp = 'cl'
ar = 'lib'
cmake = 'cmake'
qmake = '@QT_ROOT@/bin/qmake.exe'
windeployqt = '@QT_ROOT@/bin/windeployqt.exe'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
cpp_std = 'c++latest'
b_vscrt = 'md'
buildtype = 'release'
optimization = 's'
b_lto = true
